<app-jungle-background variant="subtle"></app-jungle-background>

<ion-content class="jungle-content" [fullscreen]="true">
  <div class="page-shell scrollable">
    <app-step-header [currentStep]="5" [totalSteps]="6"></app-step-header>

    <h1 class="page-title">Crée ton profil</h1>
    <p class="page-subtitle">Quelques détails pour te démarquer dans la jungle.</p>

    <div class="glass-card form-block">
      <div class="form-field">
        <label>Film préféré 1</label>
        <ion-input [(ngModel)]="movie1" placeholder="Ex. Le Roi Lion"></ion-input>
      </div>
      <div class="form-field">
        <label>Film préféré 2</label>
        <ion-input [(ngModel)]="movie2" placeholder="Ex. Avatar"></ion-input>
      </div>
      <div class="form-field">
        <label>Chanson préférée 1</label>
        <ion-input [(ngModel)]="song1" placeholder="Ex. Roar"></ion-input>
      </div>
      <div class="form-field">
        <label>Chanson préférée 2</label>
        <ion-input [(ngModel)]="song2" placeholder="Ex. Jungle"></ion-input>
      </div>
      <div class="form-field">
        <label>Couleur des yeux</label>
        <ion-select [(ngModel)]="eyeColor" interface="action-sheet" placeholder="Choisir">
          @for (c of eyeColors; track c) {
            <ion-select-option [value]="c">{{ c }}</ion-select-option>
          }
        </ion-select>
      </div>
      <div class="form-field">
        <label>Couleur des cheveux</label>
        <ion-select [(ngModel)]="hairColor" interface="action-sheet" placeholder="Choisir">
          @for (c of hairColors; track c) {
            <ion-select-option [value]="c">{{ c }}</ion-select-option>
          }
        </ion-select>
      </div>
      <div class="form-field">
        <label>Taille (cm)</label>
        <ion-input type="number" [(ngModel)]="height" placeholder="175"></ion-input>
      </div>
    </div>

    <app-primary-button
      label="Valider mon profil"
      [disabled]="!canContinue"
      (pressed)="submit()"
    ></app-primary-button>
  </div>
</ion-content>
