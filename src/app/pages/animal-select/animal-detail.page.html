<app-jungle-background variant="subtle"></app-jungle-background>

<ion-header class="ion-no-border animal-detail-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    @if (animal) {
      <ion-title>{{ animal.name }}</ion-title>
    }
  </ion-toolbar>
</ion-header>

<ion-content class="jungle-content animal-detail-page" [fullscreen]="true">
  @if (animal) {
    <div class="detail-shell">
      <app-animal-flip-card
        class="detail-card"
        [animal]="animal"
        [flipped]="flipped"
        [selected]="true"
        [expanded]="true"
        [clickable]="false"
      ></app-animal-flip-card>
    </div>
  }

  @if (canContinue) {
    <div class="floating-actions">
      <button type="button" class="floating-action floating-action--back" (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
        Retour
      </button>
      <button type="button" class="floating-action floating-action--select" (click)="continue()">
        <ion-icon name="checkmark"></ion-icon>
        Sélectionner
      </button>
    </div>
  }
</ion-content>
