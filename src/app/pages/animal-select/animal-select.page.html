<app-jungle-background variant="subtle"></app-jungle-background>

<ion-content class="jungle-content" [fullscreen]="true" [scrollY]="!expandedAnimal">
  <div class="page-shell">
    <app-step-header [currentStep]="4" [totalSteps]="6"></app-step-header>

    <h1 class="page-title">Choisis ta carte collector</h1>
    <p class="page-subtitle">Retourne une carte rare pour révéler l’âme de la créature qui te représente.</p>

    <div class="animal-grid">
      @for (animal of animals; track animal.id) {
        <app-animal-flip-card
          [animal]="animal"
          [selected]="isSelected(animal)"
          (cardClick)="onCardClick($event)"
        ></app-animal-flip-card>
      }
    </div>

    <app-primary-button [disabled]="!canContinue" (pressed)="continue()"></app-primary-button>
  </div>

  @if (expandedAnimal) {
    <div class="animal-overlay" (click)="closeExpanded()">
      <div class="animal-overlay-backdrop"></div>

      <div class="animal-overlay-panel" (click)="$event.stopPropagation()">
        <button type="button" class="overlay-close" (click)="closeExpanded($event)">
          Fermer
        </button>

        <app-animal-flip-card
          class="overlay-preview"
          [animal]="expandedAnimal"
          [flipped]="overlayFlipped"
          [selected]="selectedId === expandedAnimal.id"
          [expanded]="true"
          [clickable]="false"
        ></app-animal-flip-card>

        <p class="overlay-note">
          Animal sélectionné. Appuie sur <strong>Continuer</strong> pour valider ton choix.
        </p>
      </div>
    </div>
  }
</ion-content>
