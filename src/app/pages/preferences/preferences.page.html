<app-jungle-background variant="subtle"></app-jungle-background>

<ion-content class="jungle-content" [fullscreen]="true">
  <div class="page-shell">
    <app-step-header [currentStep]="3" [totalSteps]="6"></app-step-header>

    <h1 class="page-title">{{ 'preferences.title' | translate }}</h1>
    <p class="page-subtitle">{{ 'preferences.subtitle' | translate }}</p>

    @for (opt of options; track opt.value) {
      <button
        type="button"
        class="choice-chip"
        [class.selected]="selected === opt.value"
        (click)="select(opt.value)"
      >
        {{ opt.labelKey | translate }}
      </button>
    }

    <app-primary-button [label]="'common.continue' | translate" [disabled]="!canContinue" (pressed)="continue()"></app-primary-button>
  </div>
</ion-content>
