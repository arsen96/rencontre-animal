<app-jungle-background variant="subtle"></app-jungle-background>

<ion-content class="jungle-content" [fullscreen]="true">
  <div class="page-shell">
    <app-step-header [currentStep]="1" [totalSteps]="6"></app-step-header>

    <h1 class="page-title">Ta date de naissance</h1>
    <p class="page-subtitle">On a besoin de ton âge pour te présenter aux bons profils.</p>

    <div class="date-grid glass-card">
      <div class="form-field">
        <label>Jour</label>
        <ion-select [(ngModel)]="day" interface="action-sheet" placeholder="Jour">
          @for (d of days; track d) {
            <ion-select-option [value]="d">{{ d }}</ion-select-option>
          }
        </ion-select>
      </div>
      <div class="form-field">
        <label>Mois</label>
        <ion-select [(ngModel)]="month" interface="action-sheet" placeholder="Mois">
          @for (m of months; track m.value) {
            <ion-select-option [value]="m.value">{{ m.label }}</ion-select-option>
          }
        </ion-select>
      </div>
      <div class="form-field">
        <label>Année</label>
        <ion-select [(ngModel)]="year" interface="action-sheet" placeholder="Année">
          @for (y of years; track y) {
            <ion-select-option [value]="y">{{ y }}</ion-select-option>
          }
        </ion-select>
      </div>
    </div>

    <app-primary-button
      [disabled]="!canContinue"
      (pressed)="continue()"
    ></app-primary-button>
  </div>
</ion-content>
