<app-jungle-background variant="subtle"></app-jungle-background>

<ion-content class="jungle-content" [fullscreen]="true">
  <div class="page-shell">
    <app-step-header [currentStep]="3" [totalSteps]="5"></app-step-header>

    <h1 class="page-title">{{ 'birthdate.title' | translate }}</h1>
    <p class="page-subtitle">{{ 'birthdate.subtitle' | translate }}</p>

    <div class="date-grid glass-card">
      <div class="form-field">
        <label>{{ 'birthdate.day' | translate }}</label>
        <ion-select [(ngModel)]="day" interface="action-sheet" [placeholder]="'birthdate.day' | translate">
          @for (d of days; track d) {
            <ion-select-option [value]="d">{{ d }}</ion-select-option>
          }
        </ion-select>
      </div>
      <div class="form-field">
        <label>{{ 'birthdate.month' | translate }}</label>
        <ion-select [(ngModel)]="month" interface="action-sheet" [placeholder]="'birthdate.month' | translate">
          @for (m of months; track m) {
            <ion-select-option [value]="m">{{ 'date.month.' + m | translate }}</ion-select-option>
          }
        </ion-select>
      </div>
      <div class="form-field">
        <label>{{ 'birthdate.year' | translate }}</label>
        <ion-select [(ngModel)]="year" interface="action-sheet" [placeholder]="'birthdate.year' | translate">
          @for (y of years; track y) {
            <ion-select-option [value]="y">{{ y }}</ion-select-option>
          }
        </ion-select>
      </div>
    </div>

    <app-primary-button
      [label]="'common.continue' | translate"
      [disabled]="!canContinue"
      (pressed)="continue()"
    ></app-primary-button>
  </div>
</ion-content>
