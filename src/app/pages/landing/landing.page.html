<app-jungle-background></app-jungle-background>

<ion-content class="jungle-content" [fullscreen]="true">
  <div class="page-shell landing">
    <div class="logo-block">
      <div class="logo-ring">
        <span class="logo-emoji">🦁</span>
      </div>
      <h1 class="brand">{{ 'landing.brand' | translate }}</h1>
      <p class="tagline">{{ 'landing.tagline' | translate }}</p>
    </div>

    <div class="cta-block">
      <app-primary-button [label]="'landing.start' | translate" (pressed)="start()"></app-primary-button>
    </div>
  </div>
</ion-content>
