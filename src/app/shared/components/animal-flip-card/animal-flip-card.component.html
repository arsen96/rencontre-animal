<div
  class="flip-card"
  [class.flipped]="flipped"
  [class.selected]="selected"
  (click)="onClick()"
>
  <div class="flip-inner">
    <div class="flip-face flip-front">
      <div class="card-image collectible-stage">
        <app-animal-avatar [animal]="animal" variant="card"></app-animal-avatar>
      </div>
      <div class="card-caption">
        <span class="name">{{ animal.name }}</span>
        <span class="hint">Révéler la fiche</span>
      </div>
    </div>

    <div class="flip-face flip-back">
      <div class="flip-back-inner">
        <p class="fiche-title">Fiche collector</p>
        <h3 class="animal-name">{{ animal.name }}</h3>
        <p class="personality">{{ animal.personality }}</p>
        <p class="description">{{ animal.description }}</p>
        <div class="traits">
          @for (trait of animal.traits; track trait) {
            <span>{{ trait }}</span>
          }
        </div>
      </div>
    </div>
  </div>
</div>
