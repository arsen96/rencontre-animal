<div class="bubble-row" [class.mine]="isMine">
  <div class="bubble" [class.mine]="isMine" [class.image]="message.type === 'image'">
    @if (message.type === 'image' && message.imageUrl) {
      <img [src]="message.imageUrl" alt="Photo envoyée" loading="lazy" />
    } @else {
      <p>{{ message.text }}</p>
    }
    <time>{{ message.sentAt | date: 'HH:mm' }}</time>
  </div>
</div>
