<div
  #cardEl
  class="swipe-card collector-card"
  [class.dragging]="dragging"
  [class.exiting]="exiting"
  [style.z-index]="10 - stackIndex"
  [style.transform]="
    'translate(' + offsetX + 'px, ' + offsetY + 'px) rotate(' + rotation + 'deg) scale(' +
    (stackIndex === 0 ? 1 : 0.96 - stackIndex * 0.02) + ')'
  "
  (pointerdown)="onPointerDown($event)"
>
  <div class="stamp like" [style.opacity]="likeOpacity">LIKE</div>
  <div class="stamp pass" [style.opacity]="passOpacity">PASS</div>

  <div class="card-visual collectible-stage">
    <div class="card-image-frame">
      <app-animal-avatar [animal]="profile.animal" variant="card"></app-animal-avatar>
    </div>
    <button type="button" class="detail-btn" (click)="openDetail($event)">
      <ion-icon name="information-circle-outline"></ion-icon>
    </button>
  </div>

  <div class="card-info">
    <h2>{{ profile.displayName }}, {{ profile.age }}</h2>
    <p class="animal-label">{{ profile.animal.name }} · {{ profile.animal.personality }}</p>
    @if (profile.bio) {
      <p class="bio">{{ profile.bio }}</p>
    }
    @if (profile.distanceKm) {
      <p class="distance"><ion-icon name="location-outline"></ion-icon> {{ profile.distanceKm }} km</p>
    }
  </div>
</div>
