<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1812"/>
      <stop offset="35%" stop-color="#080f0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="tunnel" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0d1a14" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#080c0a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="depthGlow" cx="50%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#1a3028" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0a120e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.06  0 0 0 0 0.05  0 0 0 0.12 0"/>
      <feBlend in="SourceGraphic" in2="n" mode="overlay"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="390" height="844" fill="url(#sky)"/>
    <rect width="390" height="844" fill="url(#tunnel)"/>
    <rect width="390" height="844" fill="url(#depthGlow)"/>

    <!-- Distant canopy  small, soft silhouettes -->
    <g filter="url(#soft)" opacity="0.55">
      <ellipse cx="195" cy="120" rx="200" ry="90" fill="#0f1f18"/>
      <ellipse cx="60" cy="140" rx="70" ry="55" fill="#12241c"/>
      <ellipse cx="330" cy="135" rx="65" ry="50" fill="#101e17"/>
      <ellipse cx="140" cy="200" rx="45" ry="35" fill="#0d1814" opacity="0.7"/>
      <ellipse cx="260" cy="195" rx="42" ry="32" fill="#0c1612" opacity="0.65"/>
    </g>

    <!-- Far tree trunks  tiny, center stays open -->
    <g opacity="0.35" filter="url(#soft)">
      <rect x="48" y="280" width="8" height="120" rx="3" fill="#0a1510"/>
      <rect x="92" y="320" width="6" height="90" rx="2" fill="#08120e"/>
      <rect x="310" y="300" width="7" height="100" rx="2" fill="#091410"/>
      <rect x="340" y="340" width="5" height="75" rx="2" fill="#070e0b"/>
      <rect x="28" y="360" width="5" height="70" rx="2" fill="#070e0b"/>
    </g>

    <!-- Side distant hills -->
    <path fill="#0a1612" opacity="0.5" d="M0 400 Q80 360 60 520 Q40 650 0 750 L0 844 L0 400Z"/>
    <path fill="#0c1814" opacity="0.45" d="M390 420 Q310 380 330 540 Q350 660 390 760 L390 844 L390 420Z"/>
  </g>
</svg>
